---
layout: default
---
<!-- _layouts/resume.html -->
<div class="post">

  <p class="cv-download">
    <a class="btn btn-sm z-depth-0" role="button"
       href="{{ '/assets/pdf/cv.pdf' | relative_url }}" target="_blank" rel="noopener">
      Download CV (PDF)
    </a>
  </p>

  <object class="cv-embed"
          data="{{ '/assets/pdf/cv.pdf' | relative_url }}#pagemode=none"
          type="application/pdf">
    <p>
      Your browser can't display the embedded PDF.
      <a href="{{ '/assets/pdf/cv.pdf' | relative_url }}">Download the CV</a> instead.
    </p>
  </object>

</div>

<style>
  .cv-download { margin-bottom: 1rem; }
  .cv-embed {
    width: 100%;
    max-width: 750px;
    height: 1000px;
    border: 1px solid var(--global-divider-color);
  }
  @media (max-width: 768px) {
    /* phones and most tablets won't render an embedded PDF at all;
       hide the empty box and let the download button do the work */
    .cv-embed { display: none; }
  }
</style>
