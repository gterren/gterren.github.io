{% if site.enable_goatcounter_analytics and site.goatcounter_code %}
  <!-- GoatCounter (no cookies, no cross-site tracking) -->
  <script
    data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js"
  ></script>
{% endif %}

{% if site.enable_google_analytics and site.google_analytics %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
{% endif %}
