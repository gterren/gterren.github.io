- title: About
  type: text
  contents:
    - "I am a computational power systems researcher working on the planning and operation of low-carbon electricity systems under uncertainty using optimization and probabilistic forecasting methods. My research integrates power system modeling, machine learning, energy meteorology, and electricity market analysis to study grid reliability, resource adequacy, and infrastructure investment under evolving climate and socioeconomic conditions. As an educator and mentor, I am committed to building inclusive research environments where students develop technical skills, scientific curiosity, and the ability to solve problems collaboratively."

- title: Research Interests
  type: list
  contents:
    - Power systems
    - Machine learning
    - Stochastic optimization
    - Resource adequacy and reliability
    - Probabilistic forecasting
    - Electricity markets
    - Low-carbon electricity systems
    - Uncertainty quantification
    - Energy meteorology and remote sensing

